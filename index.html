</div><script>const DATA={"englishSections":[{"title":"Introduction","paragraphs":["My name is Lee Saem. My first name has an impressive meaning in Korean: “a source of power and vitality.” Since Saem sounds like Sam, I decided to make that my English name.","Growing up, I thought Lee was a common last name only in Korea. Little did I know that it’s actually common in many other countries, too. When I searched “Sam Lee” on a social media website, I was amazed at what I saw. There were so many people all over the world with that name! Just for fun, I randomly chose several Sam Lees and sent them friend requests."]},{"title":"An Unexpected Connection","paragraphs":["A lot of them accepted my friend request. While looking through their profiles, I noticed something interesting. Several Sam Lees of various ages and nationalities were interested in music. There was a Sam Lee in his mid-30s from Singapore who enjoyed singing and writing lyrics. And there was a 42-year-old Canadian Sam Lee who was a drummer. According to her profile, everyone called her Sam even though her real name was Samantha. Finally, there was an American Sam Lee who played the electric guitar.","Suddenly, I had a great idea. I sent a message to all three. Here is what I wrote: “Hi! I’m Sam Lee from Korea. I write songs and play the keyboard. How about making a virtual band called The Sam Lees?” To my surprise, all three eagerly agreed. That was the start of our band’s journey."]},{"title":"The Virtual Music Factory","paragraphs":["We tried to practice once a week through a video chat app, but we encountered several problems. First of all, we all lived in different time zones. This made it difficult to pick a convenient time for everyone to practice. Secondly, there were audio issues with the app, which caused us to be out of sync. So we put our heads together and devised a better way of playing music. We decided to assemble the songs as if we were working in a virtual music factory. After we decided on a song, I would play it on my keyboard and send it to Singaporean Sam. He would sing along with the keyboard and send the recording to American Sam. Then American Sam would add his guitar part, and Samantha would finish the song with her drumming.","When it came to choosing songs to play, we took turns. Since each of us prefers a different genre of music and comes from a different culture, we all ended up learning a lot about different kinds of music. It was interesting and a lot of fun."]},{"title":"“Long-Distance Friendship”","paragraphs":["Shortly after we started the band, a global pandemic began. Since all of our normal lives were put on hold, we valued our online interactions more than ever. At one point, Singaporean Sam became ill and needed to spend some time in the hospital, so the band took a break. However, we still met from time to time by using the video chat app. We talked about our lives and did what we could do to cheer Singaporean Sam up. Since he had to stay in the hospital on his birthday, the rest of us recorded his favorite song as his birthday present. When we played it for him, he laughed so hard that he cried. That was mainly because the song was sung by the worst singer in the band—me! It was good to see him laugh even though he was lying in his hospital bed.","After Singaporean Sam recovered, we decided to write and record our own song. We called the song “Long-Distance Friendship,” and we posted it online. The song didn’t get much attention, but we were proud of what we had achieved together. Our band is something really special. Never did we expect that we would build such strong relationships with one another. After all, we don’t come from similar backgrounds, nor have we had the same life experiences. Yet we now talk about almost everything together, including the hardships we face in life. I think it’s been really valuable to get advice from people with such different perspectives. We would all like to meet in person and play our music on the street someday. But even if that never happens, we’ve still been incredibly lucky. Four random people became great friends simply because of our names. Life can be amazing sometimes."]}],"koreanSummary":["내 이름은 이샘이다. 한국에서 ‘샘’은 ‘힘과 활력의 원천’이라는 멋진 뜻을 가지고 있다. 발음이 영어 이름 ‘Sam’과 비슷해서 나는 영어 이름을 샘 리(Sam Lee)로 정했다.","어렸을 때 나는 ‘이’ 씨가 한국에서만 흔한 성씨라고 생각했다. 그런데 알고 보니 세계 여러 나라에서도 아주 흔한 성이었다. 어느 날 소셜 미디어에서 “Sam Lee”를 검색해 보니, 전 세계에 같은 이름을 가진 사람들이 정말 많았다. 재미 삼아 몇 명에게 친구 신청을 보냈고, 그중 많은 사람이 수락했다.","프로필을 살펴보니 음악에 관심이 있는 샘 리들이 눈에 띄었다. 싱가포르의 30대 중반 남성(노래와 작사), 캐나다의 42세 여성 드러머 사만다(모두 그녀를 샘이라고 부름), 그리고 미국의 일렉트릭 기타리스트 샘 리였다. 나는 이들에게 “한국에 사는 샘 리입니다. 작곡하고 키보드를 칩니다. ‘The Sam Lees’라는 가상 밴드를 만들어 보지 않을래요?”라는 메시지를 보냈다. 놀랍게도 세 사람 모두 흔쾌히 동의했고, 이렇게 밴드가 시작되었다.","처음에는 주 1회 화상 채팅으로 연습하려 했지만, 시차와 오디오 싱크 문제로 어려움을 겪었다. 그래서 ‘가상 음악 공장’ 방식을 고안했다. 내가 키보드 연주를 녹음해 싱가포르 샘에게 보내면, 그가 노래를 입히고, 미국 샘이 기타를 더하고, 사만다가 드럼으로 마무리하는 식으로 곡을 완성했다. 곡 선정은 번갈아 가며 했고, 서로 다른 장르와 문화 덕분에 다양한 음악을 배우며 즐거움을 느꼈다.","밴드가 시작된 직후 세계적인 팬데믹이 터졌다. 일상생활이 멈춘 상황에서 우리는 온라인 만남을 더욱 소중히 여겼다. 어느 날 싱가포르 샘이 입원하게 되어 밴드는 잠시 활동을 멈췄지만, 화상 채팅으로 계속 연락하며 그를 응원했다. 그의 생일에 병원 침대에 있는 그를 위해 그가 좋아하는 노래를 녹음해 선물했는데, 내가 가장 못 부르는 사람이라 그가 크게 웃으며 눈물을 흘렸다.","회복 후 우리는 자체 곡 “Long-Distance Friendship”을 만들어 온라인에 올렸다. 큰 주목을 받지는 못했지만, 함께 이룬 성과에 자부심을 느꼈다. 배경도, 살아온 경험도 다른 네 사람이 이름 하나 때문에 깊은 우정을 쌓게 된 것이다. 이제는 삶의 힘든 이야기까지 나누며 서로에게 조언도 구한다. 언젠가 실제로 만나 거리에서 연주하고 싶지만, 설령 그것이 이루어지지 않더라도 우리는 이미 충분히 운이 좋다. 이름 때문에 만난 네 사람이 진정한 친구가 된 이 경험은, 인생이 때때로 얼마나 놀라운지를 다시 한번 보여 준다."],"meanings":{"a":"하나의","about":"~에 관하여","accepted":"수락했다","according":"~에 따르면","achieved":"이루었다","actually":"실제로","add":"더하다","advice":"조언","after":"~후에","ages":"나이들","agreed":"동의했다","all":"모두","almost":"거의","along":"함께","amazing":"놀라운","amazed":"놀란","american":"미국의, 미국인","an":"하나의","and":"그리고","another":"서로, 또 하나","app":"앱","are":"~이다","as":"~처럼, ~로서","assemble":"조립하다","at":"~에서","attention":"관심","audio":"오디오, 음향","band":"밴드","be":"~이다","became":"~이 되었다","because":"왜냐하면","bed":"침대","been":"be의 과거분사","began":"시작되었다 const sentences=DATA.englishSections.flatMap(s=>s.paragraphs.flatMap(p=>(p.match(/[^.!?]+(?:[.!?]+[”’"]?|$)/g)||[]).map(text=>({text:text.trim(),section:s.title}))));let index=0,size=Number(localStorage.getItem('lesson-size'))||58,dark=localStorage.getItem('lesson-dark')==='true';
const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=w=>w.toLowerCase().replace(/[“”‘’'—–.,!?():;0-9-]/g,'');
function notes(text){const out=[];if(/^(Little|Never)\b/.test(text))out.push(['부정어 도치','부정의 뜻을 가진 말이 앞으로 나오면서 주어와 동사의 순서가 바뀌었어.']);if(/^(When|While|Since|After|Even if|Though)\b/i.test(text))out.push(['앞부분부터 묶기','쉼표 앞부분은 시간·이유·조건을 먼저 알려 주고, 쉼표 뒤에 중심 내용이 나와.']);if(/\b(who|which|that)\b/i.test(text))out.push(['꾸며 주는 부분','who, which, that 뒤의 내용이 바로 앞의 사람이나 사물을 자세히 설명해.']);if(/\b(can|could|would|will|should|did)\b/i.test(text))out.push(['조동사','조동사 뒤에는 동사의 원래 모양이 와. 가능·예상·강조 같은 뜻을 더해 줘.']);if(/\b(am|is|are|was|were|been)\b/i.test(text))out.push(['be동사','주어의 상태·정체를 설명하거나 수동 표현을 만드는 데 쓰였어.']);if(/there (was|were|is|are)/i.test(text))out.push(['There + be동사','‘~이 있다’라는 뜻이야. 진짜 주어는 be동사 뒤에 나와.']);if(/how about/i.test(text))out.push(['How about ~ing?','‘~하는 게 어때?’라고 제안하는 표현이야.']);if(/as if/i.test(text))out.push(['as if','‘마치 ~인 것처럼’이라는 뜻이야.']);if(!out.length)out.push(['기본 순서','먼저 ‘누가/무엇이’를 찾고, 그다음 ‘무엇을 한다/어떤 상태다’를 찾으면 문장의 뼈대가 보여.']);return out.slice(0,3)}
function render(){const cur=sentences[index];$('section').textContent=cur.section;$('count').textContent=(index+1)+' / '+sentences.length+' 문장';$('sentence').textContent=cur.text;$('sentence').style.fontSize=size+'px';$('sizeLabel').textContent='글자 '+size;$('progress').style.width=((index+1)/sentences.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===sentences.length-1;const words=cur.text.match(/\d+-year-old|[A-Za-z]+-\d+s?|[A-Za-z]+(?:[’'][A-Za-z]+)?/g)||[];$('words').innerHTML=words.map(w=>'<div class="word"><strong>'+escapeHtml(w)+'</strong><span>'+escapeHtml(DATA.meanings[clean(w)]||'문맥에서 뜻 확인')+'</span></div>').join('');$('notes').innerHTML=notes(cur.text).map((n,i)=>'<div class="note"><span class="num">'+(i+1)+'</span><div><strong>'+n[0]+'</strong><p>'+n[1]+'</p></div></div>').join('');$('app').classList.toggle('dark',dark);$('theme').textContent=dark?'☀':'☾'}
$('prev').onclick=()=>{if(index>0){index--;render();scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(index<sentences.length-1){index++;render();scrollTo({top:0,behavior:'smooth'})}};$('smaller').onclick=()=>{size=Math.max(42,size-6);localStorage.setItem('lesson-size',size);render()};$('larger').onclick=()=>{size=Math.min(86,size+6);localStorage.setItem('lesson-size',size);render()};$('theme').onclick=()=>{dark=!dark;localStorage.setItem('lesson-dark',dark);render()};$('listen').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sentences[index].text);u.lang='en-US';u.rate=.68;speechSynthesis.speak(u)};$('englishTab').onclick=()=>{$('reader').classList.remove('hidden');$('summary').classList.add('hidden');$('englishTab').classList.add('active');$('koreanTab').classList.remove('active')};$('koreanTab').onclick=()=>{$('reader').classList.add('hidden');$('summary').classList.remove('hidden');$('koreanTab').classList.add('active');$('englishTab').classList.remove('active')};
$('summaryText').innerHTML=DATA.koreanSummary.map(p=>'<p>'+escapeHtml(p)+'</p>').join('');render();</script></body></html>
